[project]
name = "brospec"
version = "0.1.0"
description = "Reusable, lightweight spec validation for Python callables."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "datanooblol" },
]
keywords = ["validation", "type-checking", "contracts", "spec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/datanooblol/brospec"
Repository = "https://github.com/datanooblol/brospec"
Issues = "https://github.com/datanooblol/brospec/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brospec"]

[tool.ruff]
src = ["src/brospec"]
include = ["src/brospec/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
